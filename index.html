<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cérebro Interativo AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="header" class="overlay">
    <h1>Cérebro Interativo AR</h1>
    <p>Aponte para o marcador Hiro &bull; Toque nos pontos ou botões</p>
  </div>

  <div id="regionBtns" class="overlay"></div>

  <div id="infoPanel" class="overlay">
    <button id="closeBtn">&times;</button>
    <div class="rname"><span class="idot"></span><span class="ntext"></span></div>
    <div class="rdesc"></div>
    <div class="rfunc"></div>
  </div>

  <div id="hint" class="overlay">⏳ Carregando... Aponte para o marcador Hiro</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: false; alpha: true; precision: lowp; logarithmicDepthBuffer: false; physicallyCorrectLights: false;"
    arjs="sourceType: webcam; sourceWidth: 640; sourceHeight: 480; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
  >
    <a-assets>
      <a-asset-item id="brainModel" src="assets/human-brain.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">
      <a-entity id="brainRig">

        <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
        <a-light type="directional" intensity="1.2" color="#ffe0cc" position="2 3 2"></a-light>
        <a-light type="directional" intensity="0.5" color="#ccccff" position="-2 1 -1"></a-light>
        <a-light type="point" intensity="0.3" color="#ff8866" position="0 -0.5 0.5"></a-light>

        <a-entity id="brainRoot" position="0 0.15 0">

          <a-entity
            id="brainModel3D"
            gltf-model="#brainModel"
            position="0 0 0"
            rotation="0 -90 0"
            scale="0.3 0.3 0.3"
          ></a-entity>

          <!-- HOTSPOTS (bolinhas de marcação clicáveis) -->

          <!-- 1. Córtex Pré-Frontal -->
          <a-entity class="hotspot-group" data-region="0">
            <a-sphere class="hotspot" data-region="0" position="0.06 0.18 0.18" radius="0.028"
              material="color: #6c63ff; emissive: #6c63ff; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 800; easing: easeInOutSine">
            </a-sphere>
            <a-text value="Córtex Pré-Frontal" position="0.06 0.26 0.18" scale="0.12 0.12 0.12" color="#ffffff" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 2. Córtex Motor (topo central frente) -->
          <a-entity class="hotspot-group" data-region="1">
            <a-sphere class="hotspot" data-region="1" position="0.08 0.30 0.08" radius="0.028"
              material="color: #e94ecc; emissive: #e94ecc; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
            </a-sphere>
            <a-text value="Córtex Motor" position="0.08 0.38 0.08" scale="0.12 0.12 0.12" color="#ffffff" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 3. Lobo Parietal (topo lateral esquerda atrás) -->
          <a-entity class="hotspot-group" data-region="2">
            <a-sphere class="hotspot" data-region="2" position="-0.12 0.27 -0.12" radius="0.028"
              material="color: #34d399; emissive: #34d399; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
            </a-sphere>
            <a-text value="Lobo Parietal" position="-0.12 0.35 -0.12" scale="0.12 0.12 0.12" color="#ffffff" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 4. Lobo Temporal -->
          <a-entity class="hotspot-group" data-region="3">
            <a-sphere class="hotspot" data-region="3" position="0.22 -0.07 -0.02" radius="0.028"
              material="color: #ffd54a; emissive: #ffd54a; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 850; easing: easeInOutSine">
            </a-sphere>
            <a-text value="Lobo Temporal" position="0.22 0.02 -0.02" scale="0.12 0.12 0.12" color="#ffffff" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 5. Lobo Occipital -->
          <a-entity class="hotspot-group" data-region="4">
            <a-sphere class="hotspot" data-region="4" position="-0.19 0.10 -0.16" radius="0.028"
              material="color: #ff6b6b; emissive: #ff6b6b; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 950; easing: easeInOutSine">
            </a-sphere>
            <a-text value="Lobo Occipital" position="-0.19 0.18 -0.16" scale="0.12 0.12 0.12" color="#ffffff" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 6. Cerebelo — interno, com esfera externa apontadora -->
          <a-entity class="hotspot-group" data-region="5">
            <a-sphere class="hotspot" data-region="5" position="0.00 -0.22 -0.19" radius="0.028"
              material="color: #4ecdc4; emissive: #4ecdc4; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 750; easing: easeInOutSine">
            </a-sphere>
            <a-entity line="start: 0.00 -0.22 -0.19; end: 0.00 -0.22 -0.19; color: #4ecdc4; opacity: 0.6"></a-entity>
            <a-text value="Cerebelo" position="0.00 -0.13 -0.19" scale="0.12 0.12 0.12" color="#4ecdc4" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 7. Tronco Encefálico — interno, com esfera externa apontadora -->
          <a-entity class="hotspot-group" data-region="6">
            <a-sphere class="hotspot" data-region="6" position="0.00 -0.26 -0.03" radius="0.028"
              material="color: #ff9f43; emissive: #ff9f43; emissiveIntensity: 1.3; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 700; easing: easeInOutSine">
            </a-sphere>
            <a-entity line="start: 0.00 -0.26 -0.03; end: 0.00 -0.26 -0.03; color: #ff9f43; opacity: 0.6"></a-entity>
            <a-text value="Tronco Encefálico" position="0.00 -0.18 -0.03" scale="0.12 0.12 0.12" color="#ff9f43" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

          <!-- 8. Corpo Caloso (topo, bem acima do cérebro) -->
          <a-entity class="hotspot-group" data-region="7">
            <a-sphere class="hotspot" data-region="7" position="0.00 0.40 0.00" radius="0.032"
              material="color: #a29bfe; emissive: #a29bfe; emissiveIntensity: 1.5; transparent: true; opacity: 1.0"
              animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 1100; easing: easeInOutSine">
            </a-sphere>
            <a-entity line="start: 0.00 0.40 0.00; end: 0.00 0.10 0.00; color: #a29bfe; opacity: 1.0"></a-entity>
            <a-text value="Corpo Caloso" position="0.00 0.48 0.00" scale="0.12 0.12 0.12" color="#a29bfe" align="center" side="double" baseline="bottom"></a-text>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="js/script.js"></script>
</body>
</html>
